<div class="min-h-screen bg-[#0a1120] p-6 sm:p-12 antialiased font-sans">
  <div class="max-w-7xl mx-auto space-y-8">

    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 border-b border-white/10 gap-4">
      <div>
        <h1 class="text-3xl font-black text-white tracking-tight uppercase">Market Catalog</h1>
        <p class="text-xs font-mono text-gray-400 mt-1 uppercase tracking-widest">
          Browse items, filter inventory, and add products to cart
        </p>
      </div>

      <a *ngIf="canAddProduct" routerLink="/products/add"
        class="bg-white hover:bg-gray-100 text-[#001830] font-bold text-xs uppercase tracking-widest px-6 py-3.5 rounded-lg transition shadow-md flex items-center gap-2">
        Add New Product
      </a>
    </div>

    <!-- Search & Filter Controls Toolbar -->
    <div class="bg-[#001830] border border-white/10 rounded-2xl p-5 grid sm:grid-cols-3 gap-4 shadow-xl">
      <div>
        <label class="block text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1.5">Keyword Search</label>
        <input type="text" [(ngModel)]="searchKeyword" (ngModelChange)="applyFilters()" placeholder="Search by name or keyword..."
          class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1.5">Category Filter</label>
        <select [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()"
          class="w-full bg-slate-900 border border-white/10 rounded-lg px-3 py-2 text-xs font-semibold text-white focus:outline-none focus:border-blue-500">
          <option value="ALL">All Categories</option>
          <option value="Streetwear">Streetwear</option>
          <option value="Outerwear">Outerwear</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>

      <div>
        <div class="flex justify-between text-[10px] font-mono text-gray-400 uppercase tracking-widest mb-1.5">
          <span>Max Price</span>
          <span class="text-emerald-400 font-bold">${{ maxPrice }}</span>
        </div>
        <input type="range" min="10" max="2000" step="10" [(ngModel)]="maxPrice" (ngModelChange)="applyFilters()"
          class="w-full accent-blue-500 cursor-pointer">
      </div>
    </div>

    <!-- Loading Skeleton Placeholder -->
    <div *ngIf="isLoading" class="text-center py-20">
      <div class="inline-block animate-pulse text-white text-lg font-mono uppercase tracking-widest">
        Fetching Marketplace Registry...
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && filteredProducts.length === 0"
      class="bg-white/5 border border-white/10 rounded-2xl p-16 text-center max-w-lg mx-auto">
      <div class="text-4xl mb-4">📦</div>
      <h3 class="text-xl font-bold text-white uppercase tracking-wider">No Products Found</h3>
      <p class="text-sm text-gray-400 mt-2">No catalog entries match your search parameters.</p>
    </div>

    <!-- Product Grid -->
    <div *ngIf="!isLoading && filteredProducts.length > 0"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of filteredProducts" [product]="product" [currentUserId]="authService.getUserId()"
        [currentUserRole]="authService.getRole()" (delete)="onDeleteProduct($event)">
      </app-product-card>
    </div>

  </div>
</div>
