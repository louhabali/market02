version: "3.9"

services:

  jenkins:

    build: .

    container_name: jenkins

    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home

      # Docker socket
      - /var/run/docker.sock:/var/run/docker.sock

      # Optional: Docker CLI config
      - ~/.docker:/root/.docker:ro

volumes:
  jenkins_home: